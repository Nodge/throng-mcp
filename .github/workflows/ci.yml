name: CI
on: [push, pull_request]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  # changeset status diffs against the merge base with origin/main, which a
                  # shallow clone does not have.
                  fetch-depth: 0
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: pnpm
            - name: Install deps
              run: pnpm install --frozen-lockfile
            - name: ESLint
              run: pnpm run ci:lint
            - name: Typecheck
              run: pnpm run ci:typecheck
            - name: Prettier
              run: pnpm run ci:fmt
            - name: Build
              run: pnpm run ci:build
            - name: Changesets
              if: github.head_ref != 'changeset-release/main' && github.ref != 'refs/heads/changeset-release/main'
              run: pnpm run ci:changesets

    test:
        needs: [lint]
        strategy:
            matrix:
                node-version: [22.x, 24.x, 26.x]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm
            - name: Install deps
              run: pnpm install --frozen-lockfile
            - name: Tests
              run: pnpm run ci:tests
